[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cd-projection-smoother"
version = "0.1.0"
description = "Continuous-discrete projection smoother on exponential family manifolds: numerical validation against Koyama (2018) and the exact Kalman/RTS smoother"
requires-python = ">=3.11"
authors = [{ name = "Md Shamim Akhter" }, { name = "Muhammad Emzir" }]
license = { text = "GPL-3.0-or-later" }
keywords = [
  "continuous-discrete-smoothing",
  "projection-filter",
  "exponential-family",
  "kalman-smoother",
  "stochastic-differential-equations",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "jax>=0.8.0",
  "jaxlib>=0.8.0",
  "diffrax>=0.7.0",
  "equinox>=0.13.0",
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "h5py>=3.11",
  "chex>=0.1.88",
  "jaxtyping>=0.2.36",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.setuptools]
packages = ["cd_smoother"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# jaxtyping shape strings (e.g. Float[Array, " n"]) are not forward references
ignore = ["F722"]
